<main id="main">
  <section class="section">
    <figure class="h-place-map" aria-labelledby="place-map-title" aria-describedby="place-map-desc">
      <svg viewBox="0 0 400 220" role="img" aria-labelledby="place-map-title" aria-describedby="place-map-desc">
        <title id="place-map-title">Schematic map of Gillespie County, Texas</title>
        <desc id="place-map-desc">A stylized, not-to-scale diagram showing Fredericksburg and Grapetown, Texas, a few miles apart in Gillespie County.</desc>
        <rect width="400" height="220" fill="#1b1712"/>
        <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
          <line x1="0" y1="55" x2="400" y2="55"/>
          <line x1="0" y1="110" x2="400" y2="110"/>
          <line x1="0" y1="165" x2="400" y2="165"/>
          <line x1="100" y1="0" x2="100" y2="220"/>
          <line x1="200" y1="0" x2="200" y2="220"/>
          <line x1="300" y1="0" x2="300" y2="220"/>
        </g>
        <path d="M200,90 C210,130 215,150 208,168" fill="none" stroke="#d8b466" stroke-width="1.6" stroke-dasharray="2 6" stroke-linecap="round"/>
        <circle cx="200" cy="90" r="7" fill="#c79a42"/>
        <circle cx="200" cy="90" r="7" fill="none" stroke="#f3ecdd" stroke-width="1"/>
        <text x="200" y="70" text-anchor="middle" font-family="Fraunces, serif" font-size="16" font-weight="600" fill="#f3ecdd">Fredericksburg</text>
        <circle cx="208" cy="168" r="6" fill="#8c6a9c"/>
        <circle cx="208" cy="168" r="6" fill="none" stroke="#f3ecdd" stroke-width="1"/>
        <text x="208" y="192" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#f3ecdd">Grapetown</text>
        <text x="208" y="206" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#c9bea9">a few miles south</text>
      </svg>
      <figcaption class="h-place-map-caption">Schematic, not to scale. See the list below for the same information.</figcaption>
    </figure>

    <ul class="h-entity-list" data-related="all-places" style="grid-template-columns:1fr;"></ul>
  </section>
</main>
